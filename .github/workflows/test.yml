name: tests

on:
  push:
  pull_request:

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ui,deploy]"
      - run: pytest -q
      - run: python -m py_compile operator_ui.py agentcore_app.py
